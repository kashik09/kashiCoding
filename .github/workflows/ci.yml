name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Note: type-check script not configured
      # Uncomment when added to package.json:
      # - name: Type check
      #   run: npm run type-check

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
